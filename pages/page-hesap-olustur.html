<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>PayApp - Finance, Banking, Wallet, Crypto Mobile PWA</title>
    <link rel="stylesheet" type="text/css" href="/styles/bootstrap.css" />
    <link rel="stylesheet" type="text/css" href="/styles/style.css?v=1" />
    <link rel="stylesheet" type="text/css" href="/fonts/bootstrap-icons.css" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet" />
    <link rel="manifest" href="/_manifest.json" />
    <meta id="theme-check" name="theme-color" content="#FFFFFF" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="app/icons/icon-192x192.png" />
  </head>

  <body class="theme-light">
    <div id="preloader">
      <div class="spinner-border color-highlight" role="status"></div>
    </div>

    <!-- Page Wrapper-->
    <div id="page">
      <!-- Footer Bar -->

      <!-- Page Content - Only Page Elements Here-->
      <div class="page-content footer-clear">
        <!-- Page Discription -->
        <div class="my-5 pt-5 text-center color-theme mx-4">
          <h1>
            Devam Edebilmek için Lütfen Kullanıcı Adı ve Şifre Belirleyin.
          </h1>
        </div>
        <!-- Form Area -->
        <div class="card card-style shadow-none bg-transparent">
          <div class="content mb-0">
            <div
              class="form-custom form-label form-border form-icon mb-3 bg-transparent">
              <i class="bi bi-person-circle font-13 bg-transparent"></i>
              <input
                type="text"
                class="form-control rounded-xs bg-transparent"
                id="c1"
                placeholder="Kullanıcı Adı" />
              <label for="c1" class="bg-transparent">Kullanıcı Adı</label>
              <span>(Gerekli)</span>
            </div>
            <div
              class="form-custom form-label form-border form-icon mb-3 bg-transparent">
              <i class="bi bi-asterisk font-13 bg-transparent"></i>
              <input
                type="password"
                class="form-control rounded-xs bg-transparent"
                id="c2"
                placeholder="Şifre Belirleyin" />
              <label for="c2" class="bg-transparent">Şifre Belirleyin</label>
              <span>(required)</span>
            </div>
            <div
              class="form-custom form-label form-border form-icon mb-4 bg-transparent">
              <i class="bi bi-asterisk font-13 bg-transparent"></i>
              <input
                type="password"
                class="form-control rounded-xs bg-transparent"
                id="c3"
                placeholder="Şifreyi Doğrulayın" />
              <label for="c3" class="bg-transparent">Şifreyi Doğrulayın</label>
              <span>(required)</span>
            </div>
            <div class="form-check form-check-custom">
              <input
                class="form-check-input"
                type="checkbox"
                name="type"
                value=""
                id="c2a" />
              <label class="form-check-label font-12" for="c2a"
                ><a href="#" class="text-decoration-underline color-theme"
                  >Hüküm ve Koşulları</a
                >
                kabul ediyorum.</label
              >
              <i
                class="is-checked color-theme font-13 bi bi-check-circle-fill"></i>
              <i class="is-unchecked color-theme font-13 bi bi-circle"></i>
            </div>
            <a
              href="index.html"
              class="btn btn-full color-bg-theme color-alt-theme mt-4"
              >Hesap Oluştur</a
            >
            <div class="row">
              <div class="col-6 text-start">
                <a
                  href="page-sifremi-unuttum.html"
                  class="font-11 color-theme opacity-40 pt-4 d-block"
                  >Şifremi Unuttum</a
                >
              </div>
              <div class="col-6 text-end">
                <a
                  href="page-giris-yap.html"
                  class="font-11 color-theme opacity-40 pt-4 d-block"
                  >Giriş Yap</a
                >
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- End of Page Content-->

      <!-- Off Canvas and Menu Elements-->
      <!-- Always outside the Page Content-->
    </div>
    <!-- End of Page ID-->

    <script src="/scripts/bootstrap.min.js"></script>
    <script src="/scripts/custom.js"></script>
  </body>
</html>
