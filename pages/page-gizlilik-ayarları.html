            <div class="position-absolute start-0">
              <a href="page-ayarlar.html" class="ms-3 icon icon-s">

          <div class="content mb-0">
            <a
              href="#"
              data-trigger-switch="switch-1ac"

                </div>
              </div>
            </a>
            <div class="divider my-1 opacity-70"></div>
            <a
              href="#"
              data-trigger-switch="switch-2ac"

              </div>

                <h5 class="mb-0">Transfer Talebi</h5>
                <p>Diğer kişilerden gelecek transfer taleplerini kapat.</p>
              </div>
              <div class="ms-auto text-end">
                <div class="form-switch ios-switch switch-green switch-m">

                  <label class="custom-control-label" for="switch-2ac"></label>
