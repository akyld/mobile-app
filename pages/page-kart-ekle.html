<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>PayApp - Finance, Banking, Wallet, Crypto Mobile PWA</title>
    <link rel="stylesheet" type="text/css" href="/styles/bootstrap.css" />
    <link rel="stylesheet" type="text/css" href="/styles/style.css?v=1" />
    <link rel="stylesheet" type="text/css" href="/fonts/bootstrap-icons.css" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet" />
    <link rel="manifest" href="/_manifest.json" />
    <meta id="theme-check" name="theme-color" content="#FFFFFF" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="app/icons/icon-192x192.png" />
  </head>

  <body class="theme-light">
    <div id="preloader">
      <div class="spinner-border color-highlight" role="status"></div>
    </div>

    <!-- Page Wrapper-->
    <div id="page">
      <!-- Page Content - Only Page Elements Here-->
      <div class="page-content footer-clear">
        <!-- Page Title-->
        <div class="pt-3">
          <div
            class="page-title position-relative d-flex align-items-center justify-content-center">
            <div class="position-absolute start-0">
              <a href="menu-kartlar.html" class="ms-3 icon icon-s">
                <i class="bi bi-chevron-left color-theme font-14"></i>
              </a>
            </div>
            <h1 class="mb-0">Kart Ekle</h1>
          </div>
        </div>

        <div class="card card-style list-bg-theme">
          <div class="content">
            <h4>Kart Bilgilerinizi Girin</h4>
            <p>
              Kart bilgilerinizi girerek hesabınıza kartınızı ekleyebilirsiniz.
            </p>
            <div class="form-custom form-label form-icon mb-3 mt-5">
              <i class="bi bi-person-circle font-14"></i>
              <input
                type="text"
                class="form-control rounded-xs"
                id="c1"
                placeholder="Kart Sahibi" />
              <label for="c1" class="color-highlight form-label-always-active"
                >Kart Sahibi</label
              >
            </div>
            <div class="row">
              <div class="col-12">
                <div class="form-custom form-label mb-3">
                  <input
                    type="number"
                    class="form-control rounded-xs"
                    id="c3"
                    placeholder="1234 5678 9012 3456" />
                  <label
                    for="c3"
                    class="color-highlight form-label-always-active"
                    >Kart Numarası</label
                  >
                </div>
              </div>
              <div class="col-4">
                <div class="form-custom form-label mb-3">
                  <input
                    type="number"
                    class="form-control rounded-xs"
                    id="c3"
                    placeholder="313" />
                  <label
                    for="c3"
                    class="color-highlight form-label-always-active"
                    >CCV</label
                  >
                </div>
              </div>
              <div class="col-4">
                <div class="form-custom form-label mb-3">
                  <select
                    class="form-select rounded-xs"
                    id="c6"
                    aria-label="Floating label select example">
                    <option value="1">01</option>
                    <option value="2">02</option>
                    <option value="3">03</option>
                    <option value="4">04</option>
                    <option value="5">05</option>
                    <option value="6">06</option>
                    <option value="7">07</option>
                    <option value="8">08</option>
                    <option value="9">09</option>
                    <option value="10">10</option>
                    <option value="11">11</option>
                    <option value="12">12</option>
                  </select>
                  <label
                    for="c6"
                    class="color-highlight form-label-always-active"
                    >Ay</label
                  >
                </div>
              </div>
              <div class="col-4">
                <div class="form-custom form-label mb-3">
                  <select
                    class="form-select rounded-xs"
                    id="c61"
                    aria-label="Floating label select example">
                    <option value="1">2021</option>
                    <option value="2">2022</option>
                    <option value="3">2023</option>
                    <option value="4">2024</option>
                    <option value="5">2025</option>
                  </select>
                  <label
                    for="c61"
                    class="color-highlight form-label-always-active"
                    >Yıl</label
                  >
                </div>
              </div>
            </div>
            <div class="divider mt-2 mb-4"></div>
            <a
              href="menu-kartlar.html"
              data-bs-dismiss="offcanvas"
              class="btn btn-full color-bg-theme color-alt-theme shadow-bg shadow-bg-s"
              >Kart Ekle</a
            >

            <!-- End of Tab Wrapper-->
          </div>
        </div>
      </div>
      <!-- End of Page Content-->

      <!-- Off Canvas and Menu Elements-->
      <!-- Always outside the Page Content-->
    </div>
    <!-- End of Page ID-->

    <script src="/scripts/bootstrap.min.js"></script>
    <script src="/scripts/custom.js"></script>
  </body>
</html>
